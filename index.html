<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6A1FD1">
<title>Brainrot of the AI - BotA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%236A1FD1' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1d1d1f;--muted:#5c5c66;--line:#d9d9de;--accent:#6A1FD1;--link:#6A1FD1;--code:#f1eef7;--pre:#f6f4fa;--zebra:#f7f6fa;--on:#efe6fb;--hover:#f3eefb}
@media(prefers-color-scheme:dark){:root{--bg:#15131a;--fg:#e8e6ee;--muted:#a8a4b3;--line:#3a3646;--link:#b794f6;--code:#2a2638;--pre:#1d1a26;--zebra:#1b1822;--on:#2a2140;--hover:#221d30}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,sans-serif;display:flex;min-height:100vh;color:var(--fg);background:var(--bg);border-top:4px solid var(--accent)}
.skip{position:absolute;left:8px;top:-60px;background:var(--bg);color:var(--link);padding:8px 12px;border:2px solid var(--accent);z-index:10}
.skip:focus{top:8px}
nav{width:290px;flex:none;border-right:1px solid var(--line);padding:16px 10px;overflow:auto;position:sticky;top:0;height:100vh}
nav>strong{display:block;padding:0 8px}
nav ul{list-style:none;margin:0;padding:0}
nav details{margin-top:10px}
nav summary{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;cursor:pointer}
nav a{display:block;padding:6px 8px;color:var(--link);text-decoration:none;font-size:14px;border-radius:3px}
nav a:hover{background:var(--hover);text-decoration:underline}
nav a:focus-visible,nav summary:focus-visible,main a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav a[aria-current=page]{background:var(--on);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
main{flex:1;min-width:0;padding:28px 40px}
main>*{max-width:72ch}
main>.tw{max-width:none}
main a{color:var(--link)}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .6em}
h2{font-size:1.5rem;line-height:1.25;margin:1.6em 0 .5em}
h3{font-size:1.2rem;line-height:1.3;margin:1.4em 0 .4em}
blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--accent);background:var(--zebra);color:var(--muted)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
code{background:var(--code);padding:1px 4px;border-radius:3px}
pre{background:var(--pre);padding:12px;overflow:auto;border-radius:4px}
pre code{background:none;padding:0}
.tw{overflow:auto;max-height:80vh;margin:12px 0;border:1px solid var(--line)}
table{border-collapse:collapse;font-size:14px;width:max-content;min-width:100%}
td,th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
th{position:sticky;top:0;background:var(--on);text-align:left;z-index:1}
tbody tr:nth-child(even){background:var(--zebra)}
.sw{display:inline-block;min-width:1.8em;padding:0 6px;margin-right:4px;text-align:center;font-weight:600;border-radius:3px;border:1px solid #777}
.sw-L{background:#d9d9d9;color:#000}
.sw-M{background:#8c8c8c;color:#000}
.sw-D{background:#404040;color:#fff}
@media(max-width:800px){body{flex-direction:column}nav{width:auto;height:auto;max-height:40vh;position:static;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px}}
</style>
</head>
<body>
<a class="skip" href="#doc">Skip to content</a>
<nav id="nav" aria-label="Documents"><strong>Brainrot of the AI - BotA</strong><div id="list"></div></nav>
<main id="doc" tabindex="-1" aria-live="polite" aria-busy="true">Loading…</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
const list = document.getElementById("list");
const doc = document.getElementById("doc");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const label = f => f.replace(/^.*\//, "").replace(/\.[^.]*$/, "").replace(/^0+(?=\d)/, "").replace(/-/g, " ");
const startLink = '<p><a href="#">Back to start</a></p>';
let current = "README.md";
async function build() {
  try {
    const r = await fetch("manifest.json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const sections = await r.json();
    list.innerHTML = sections.map(s => `<details${/^characters$/i.test(s.title) ? "" : " open"}><summary>${esc(s.title)}</summary><ul>` +
      s.files.map(f => `<li><a href="#${encodeURIComponent(f)}" data-path="${esc(f)}">${esc(label(f))}</a></li>`).join("") + "</ul></details>").join("");
  } catch (e) {
    list.innerHTML = `<p>Navigation failed to load: ${esc(e.message)}. ${startLink}</p>`;
  }
  route();
}
function swatches(root) {
  root.querySelectorAll("td").forEach(td => {
    const t = td.textContent.trim();
    if (/^[LMD](\s*\/\s*[LMD])+$/.test(t)) td.innerHTML = t.split(/\s*\/\s*/).map(c => `<span class="sw sw-${c}">${c}</span>`).join("");
  });
}
function wrapTables(root) {
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div");
    w.className = "tw";
    t.replaceWith(w);
    w.appendChild(t);
  });
}
function markActive(path) {
  document.querySelectorAll("#nav a").forEach(a => {
    const on = a.dataset.path === path;
    if (on) { a.setAttribute("aria-current", "page"); const d = a.closest("details"); if (d) d.open = true; a.scrollIntoView({ block: "nearest" }); }
    else a.removeAttribute("aria-current");
  });
}
async function show(path) {
  current = path;
  doc.setAttribute("aria-busy", "true");
  try {
    const r = await fetch(path);
    if (!r.ok) { doc.textContent = "Not found: " + path; document.title = path; return; }
    const text = await r.text();
    if (path !== current) return;
    const isMd = /\.(md|prd)$/.test(path);
    doc.innerHTML = isMd && window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`;
    wrapTables(doc);
    swatches(doc);
    const h = doc.querySelector("h1");
    document.title = (h ? h.textContent.trim() : path) + " - BotA";
    markActive(path);
    window.scrollTo(0, 0);
  } catch (e) {
    doc.innerHTML = `<p>Could not load ${esc(path)}: ${esc(e.message)}</p>${startLink}`;
    document.title = path;
  } finally {
    if (path === current) doc.setAttribute("aria-busy", "false");
  }
}
function route() {
  let p = "README.md";
  try { p = decodeURIComponent(location.hash.slice(1)) || p; } catch (e) {}
  show(p);
}
doc.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const href = a.getAttribute("href");
  if (/^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href) || !/\.(md|tsv|yaml)([?#].*)?$/i.test(href)) return;
  const pageBase = new URL(".", location.href.split("#")[0]);
  const target = new URL(href, new URL(current, pageBase));
  if (!target.pathname.startsWith(pageBase.pathname)) return;
  e.preventDefault();
  location.hash = "#" + encodeURIComponent(decodeURIComponent(target.pathname.slice(pageBase.pathname.length)));
});
window.addEventListener("hashchange", route);
build();
</script>
</body>
</html>
